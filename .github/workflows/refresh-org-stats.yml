name: Refresh ORC Org Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    paths:
      - profile/README.md
      - scripts/**
      - .github/workflows/refresh-org-stats.yml

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: pip install fonttools brotli

      - name: Generate organization stats
        env:
          ORG_STATS_TOKEN: ${{ secrets.ORG_STATS_TOKEN }}
        run: |
          python scripts/generate_org_stats.py \
            --org ORC-Robotics \
            --assets profile/assets \
            --json profile/assets/org-stats.json \
            --readme profile/README.md

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A profile
            git commit -m "Refresh organization stats"
            git push
          fi
